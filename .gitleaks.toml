# Keeps the default rules and allows the made-up values the tests use. Matching on the value
# (not on a commit) keeps this working after a squash or rebase.
[extend]
useDefault = true

[allowlist]
description = "Made-up passwords and setup tokens in test fixtures"
regexes = [
  '''^een-lang-wachtwoord-2026$''',
  # Stands in an earlier commit of phase 1c; the test now uses the value above.
  '''^een-lang-wachtwoord-123$''',
  '''^uit-de-omgeving-123$''',
  '''^sk-geheime-sleutel-123$''',
  # Made-up back-up passwords in the tests of back-up and restore (B1).
  '''^Geheim-Wachtwoord-123$''',
  '''^S3CR3T-0123456789$''',
]
