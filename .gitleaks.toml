# Keeps the default rules and allows the made-up values the tests use. Matching on the value
# (not on a commit) keeps this working after a squash or rebase.
[extend]
useDefault = true

[allowlist]
description = "Made-up passwords and setup tokens in test fixtures"
regexes = [
  '''^een-lang-wachtwoord-2026$''',
  # Stands in an earlier commit of phase 1c; the test now uses the value above.
  '''^een-lang-wachtwoord-123$''',
  '''^uit-de-omgeving-123$''',
  '''^sk-geheime-sleutel-123$''',
  # Made-up back-up passwords in the tests of back-up and restore (B1).
  '''^Geheim-Wachtwoord-123$''',
  '''^S3CR3T-0123456789$''',
  # Made-up passwords in the tests of members and devices (1d part A), and the derived
  # key of the published pairing test vector (tests/fixtures/pairing_proof_v1.json).
  '''^een-lang-wachtwoord-voor-mila-2026$''',
  '''^een-lang-nieuw-wachtwoord-2026$''',
  '''^een-nieuw-lang-wachtwoord-2026$''',
  '''^nog-een-ander-wachtwoord-77$''',
  '''^b0d30d4a0224e576656286cc732bc500d8b93217860fd69ca42cb95cf245105f$''',
  # A made-up tunnel token in an earlier commit of external access (base64 of a sentence);
  # the test now makes its value at run time.
  '''^eyJhIjoicGxhbnRlZC10dW5uZWwtdG9rZW4tdmFsdWUifQ$''',
  # Not a secret: in `filter(session_key=request.session.session_key, second_factor=True)`
  # the generic rule takes the comma for an assignment and the next argument for a key.
  '''^second_factor=True$''',
]
