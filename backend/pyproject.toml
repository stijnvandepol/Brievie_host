[project]
name = "brievie"
version = "0.2.0"
description = "Brievie host: keeps, explains and tracks the mail of a household or small business."
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "django~=6.1.0",
    "django-axes>=9.0.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "procrastinate>=3.11.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "DJ", "PT", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501", "RUF012"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]
# factory-boy ships py.typed but leaves its declaration helpers unannotated.
untyped_calls_exclude = ["factory"]

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "brievie.settings"

# Coverage is measured in CI (`pytest --cov`); a plain `make test` does not measure it.
[tool.coverage.run]
source = ["."]
branch = true
omit = ["tests/*", "*/migrations/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# THE ONE PLACE for the backend's minimum: set `fail_under = <percent>` here, from the
# first CI run's total. Until then coverage is reported, never enforced.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "brievie.settings"
testpaths = ["tests"]
addopts = "--strict-markers -p tests.backup_support"
pythonpath = ["."]
filterwarnings = [
    "error",
    # WhiteNoise warns when collectstatic has not run; tests do not serve static files.
    "ignore:No directory at.*staticfiles:UserWarning",
]
