[project]
name = "brievie"
version = "0.1.0"
description = "Brievie host: keeps, explains and tracks the mail of a household or small business."
requires-python = ">=3.13"
dependencies = [
    "django~=6.1.0",
    "django-axes>=9.0.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "DJ", "PT", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501", "RUF012"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]
# factory-boy ships py.typed but leaves its declaration helpers unannotated.
untyped_calls_exclude = ["factory"]

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "brievie.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "brievie.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
filterwarnings = [
    "error",
    # WhiteNoise warns when collectstatic has not run; tests do not serve static files.
    "ignore:No directory at.*staticfiles:UserWarning",
]
