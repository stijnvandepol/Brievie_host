name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday, Wednesday and Friday, 04:41 UTC (not on the hour, and an hour after ci.yml's
    # schedule), so new queries also run over code that has not changed.
    - cron: "41 4 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the group: a scheduled run and a push run never cancel each other.
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploads the results to the code scanning alerts
    strategy:
      fail-fast: false
      matrix:
        # Python and TypeScript need no build; "actions" analyses the workflows.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  # When the scheduled run fails, open an issue (see audit-failed.yml). Findings are not
  # failures: they go to the code scanning alerts. This reports a run that broke.
  audit-failed:
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    needs: [analyze]
    permissions:
      issues: write
    # actionlint (1.7.12) does not know the `$/` self-repository syntax yet.
    uses: ./.github/workflows/audit-failed.yml # zizmor: ignore[self-repository]
    with:
      needs: ${{ toJSON(needs) }}
