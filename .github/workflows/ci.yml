name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Everything that can find a NEW problem without a code change (a new CVE in a locked
  # package, a Debian update in the image, a new secret rule, a new ZAP or zizmor check)
  # runs on the default branch three times a week, and on demand. Not on the hour: many
  # schedules fire then, and GitHub delays or drops some of them. The jobs that only
  # judge the code (backend, web, stack, restore) are skipped on these runs: the code did
  # not change. A failed scheduled run opens an issue (job `audit-failed`).
  schedule:
    - cron: "23 3 * * 1,3,5" # Monday, Wednesday, Friday, 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Pushes to main all run
# to the end, so every commit on main has a complete result. The event is in the group,
# so a scheduled run neither cancels a push run nor waits behind it (and a queued push
# run never replaces a queued scheduled one).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The backend suite takes ~22 minutes on one runner, so it is split over parallel shards,
  # each with its own PostgreSQL. A shard is a set of test FILES (tests/sharding.py, weights
  # in tests/shard_weights.json); the job `backend` below waits for all of them and checks
  # that together they ran every test once.
  backend-tests:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    name: backend-tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ format('pg-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPASSWORD: ${{ format('pg-{0}-{1}', github.run_id, github.run_attempt) }}
      POSTGRES_USER: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      # The role passwords and the secret key are made per job and masked: no literal
      # secret in this file. The URLs are built from them.
      - name: Generate the CI-only secrets
        run: |
          set -euo pipefail
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          backup=$(openssl rand -hex 24)
          # 96 hex characters: the settings refuse keys shorter than 50.
          secret_key=$(openssl rand -hex 48)
          for value in "$owner" "$app" "$backup" "$secret_key"; do echo "::add-mask::$value"; done
          {
            echo "BRIEVIE_OWNER_PASSWORD=$owner"
            echo "BRIEVIE_APP_PASSWORD=$app"
            echo "BRIEVIE_BACKUP_DB_PASSWORD=$backup"
            echo "SECRET_KEY=$secret_key"
            echo "DATABASE_URL=postgres://brievie_app:$app@localhost:5432/brievie"
            echo "DATABASE_OWNER_URL=postgres://brievie_owner:$owner@localhost:5432/brievie"
            echo "DATABASE_BACKUP_URL=postgres://brievie_backup:$backup@localhost:5432/brievie"
          } >> "$GITHUB_ENV"
      - name: Create database roles
        run: bash ../deploy/postgres-init/01-roles.sh
      - run: uv sync --frozen
      # tests/test_brievie_wrapper.py runs ShellCheck on ./brievie and fails in CI without it.
      - name: ShellCheck is available
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      # The real-restic tests run here and fail without restic (like ShellCheck): the
      # image's own binary, from the official image pinned by version and digest, exactly
      # as deploy/Dockerfile copies it (a text test compares the two).
      - name: restic from the image's pinned official image
        run: |
          id=$(docker create restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510)
          docker cp "$id:/usr/bin/restic" "$RUNNER_TEMP/restic"
          docker rm "$id"
          sudo install -m 0755 "$RUNNER_TEMP/restic" /usr/local/bin/restic
          restic version
      # Coverage is reported, not enforced: the minimum goes in pyproject.toml
      # ([tool.coverage.report] fail_under), the one place for it. Each shard writes its own
      # data file; `backend` combines them.
      - name: Tests (shard ${{ matrix.shard }} of 6)
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: uv run pytest -p tests.sharding --shard ${{ matrix.shard }}/6 --shard-report shard-${{ matrix.shard }}.json --durations=25 --cov
      - name: Keep the shard's coverage data and test count
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-shard-${{ matrix.shard }}
          path: |
            backend/.coverage.shard${{ matrix.shard }}
            backend/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error

  # Everything that judges the code without running the tests, in parallel with the shards.
  backend-static:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ format('pg-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPASSWORD: ${{ format('pg-{0}-{1}', github.run_id, github.run_attempt) }}
      POSTGRES_USER: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      # The role passwords and the secret key are made per job and masked: no literal
      # secret in this file. The URLs are built from them.
      - name: Generate the CI-only secrets
        run: |
          set -euo pipefail
          owner=$(openssl rand -hex 24)
          app=$(openssl rand -hex 24)
          backup=$(openssl rand -hex 24)
          # 96 hex characters: the settings refuse keys shorter than 50.
          secret_key=$(openssl rand -hex 48)
          for value in "$owner" "$app" "$backup" "$secret_key"; do echo "::add-mask::$value"; done
          {
            echo "BRIEVIE_OWNER_PASSWORD=$owner"
            echo "BRIEVIE_APP_PASSWORD=$app"
            echo "BRIEVIE_BACKUP_DB_PASSWORD=$backup"
            echo "SECRET_KEY=$secret_key"
            echo "DATABASE_URL=postgres://brievie_app:$app@localhost:5432/brievie"
            echo "DATABASE_OWNER_URL=postgres://brievie_owner:$owner@localhost:5432/brievie"
            echo "DATABASE_BACKUP_URL=postgres://brievie_backup:$backup@localhost:5432/brievie"
          } >> "$GITHUB_ENV"
      - name: Create database roles
        run: bash ../deploy/postgres-init/01-roles.sh
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Migrations match the models
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI contract is up to date
        run: uv run python manage.py export_openapi --check
      - name: English catalogue is complete and up to date
        run: uv run python manage.py update_messages --check

  # The required check `backend`: green only when every shard and the static checks are
  # green and the shards together ran the whole suite once. `!cancelled()` plus the first
  # step: a skipped job would count as passed for the required check.
  backend:
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    needs: [backend-tests, backend-static]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Every shard and the static checks passed
        working-directory: .
        env:
          RESULTS: ${{ needs.backend-tests.result }} ${{ needs.backend-static.result }}
        run: |
          echo "$RESULTS"
          [ "$RESULTS" = "success success" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-shard-*
          path: backend/shards
          merge-multiple: true
      - run: uv sync --frozen
      - name: The shards together ran every test exactly once
        run: |
          python3 - <<'PY'
          import glob, json
          reports = [json.load(open(f)) for f in sorted(glob.glob("shards/shard-*.json"))]
          assert sorted(r["shard"] for r in reports) == [1, 2, 3, 4, 5, 6], reports
          assert len({r["total"] for r in reports}) == 1, reports
          selected = sum(r["selected"] for r in reports)
          total = reports[0]["total"]
          print(f"shards ran {selected} of {total} collected tests")
          assert selected == total > 0, (selected, total)
          PY
      - name: Combine the coverage of the shards
        run: |
          uv run coverage combine shards/.coverage.shard*
          uv run coverage report
          uv run coverage xml
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore
      # Every package of uv.lock (runtime and dev), by exact version and hash, against
      # the PyPI/OSV advisories; fails on any known vulnerability. --disable-pip: the
      # locked, hashed list is audited as it is, nothing is resolved or installed.
      # (uv 0.13.8 has `uv audit`, but marks it experimental.) Kept in step with the job
      # `audit-python` (a text test compares the two): a pull request is gated here, the
      # schedule runs it alone there.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  web:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action reads "packageManager" from the repo root by default; ours is in web/.
      # (defaults.run.working-directory does not apply to `uses:` steps.)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: API types match the OpenAPI contract
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Text catalogue is up to date
        run: |
          pnpm extract
          git diff --exit-code -I POT-Creation-Date src/locales
      # Coverage is reported, not enforced: the minimum goes in vite.config.ts
      # (test.coverage.thresholds), the one place for it.
      - run: pnpm test:coverage
      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/
          if-no-files-found: ignore
      - run: pnpm build
      # Kept in step with the job `audit-node` (a text test compares the two).
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  # The dependency audits alone, for the scheduled and manual runs: the lock files stay
  # the same, the advisories do not. On pull requests and pushes the same commands run
  # inside `backend` and `web`, which are the required checks.
  audit-python:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  audit-node:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      # pnpm audit reads the lock file; nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The workflows themselves: injection through expressions, unpinned or impostor
  # actions, excessive permissions, leaked credentials (zizmor's online audits use
  # the job's read-only token).
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.8"
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.32.0 --format=github .github/workflows

  # The image as it ships: lint its Dockerfile, build it, scan what is inside (Debian
  # packages, the virtualenv, restic, the PostgreSQL client) for known vulnerabilities.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile
          # Style and info findings are shown, warnings and errors fail.
          failure-threshold: warning
          # DL3008 (pin apt package versions): postgresql-client-18 comes from PGDG,
          # which keeps only the newest build of each major; a pinned build would stop
          # resolving within weeks. The major is pinned and tested against the server
          # (test_pg_client_major_matches_the_server); the Trivy scan below covers
          # known vulnerabilities in what was installed.
          ignore: DL3008
      - name: Lint the proxy Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/Dockerfile.proxy
          failure-threshold: warning
      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag brievie/backend:scan .
      - name: Build the proxy image
        run: docker build --file deploy/Dockerfile.proxy --tag brievie/proxy:scan .
      - name: The proxy accepts its own Caddyfile
        run: |
          docker run --rm --network none \
            -e BRIEVIE_HOSTNAME=brievie.test -e BRIEVIE_HSTS_SECONDS=0 \
            -e BRIEVIE_MAX_BODY_BYTES=2621440 -e BRIEVIE_MAX_UPLOAD_BYTES=33554432 \
            brievie/proxy:scan caddy validate --config /etc/caddy/Caddyfile
      - name: The proxy carries the Caddyfile and script of the repository
        run: |
          id=$(docker create brievie/proxy:scan)
          docker cp "$id:/etc/caddy/Caddyfile" "$RUNNER_TEMP/Caddyfile"
          docker cp "$id:/etc/caddy/publish-root.sh" "$RUNNER_TEMP/publish-root.sh"
          docker rm "$id"
          cmp "$RUNNER_TEMP/Caddyfile" deploy/Caddyfile
          cmp "$RUNNER_TEMP/publish-root.sh" deploy/caddy-publish-root.sh
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: brievie/backend:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          # Only what an update can fix: an unfixed CVE is no reason to stop a change.
          ignore-unfixed: true
          exit-code: "1"
          # Accepted findings, scoped to one file and each with an expiry date.
          # The entries expire on 2027-01-31 by design: from then on they stop applying,
          # and unless restic has a release that fixes them by then, this job fails on the
          # first scheduled run after that day (and on every push). That failure opens the
          # issue of `audit-failed`, which is the reminder to update restic or the entries.
          trivyignores: .trivyignore.yaml
      - name: Scan the proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: brievie/proxy:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  # The way a user installs it: fresh secrets, build the images, start everything.
  stack:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose --project-directory deploy -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create deploy/.env with fresh secrets
        run: sh deploy/init-env.sh
      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: The API answers through Caddy
        run: |
          # Caddy signs with its own CA, which this runner does not trust.
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/health
      - name: The health endpoint reports the version of backend/pyproject.toml
        run: |
          curl --fail --silent --show-error --insecure https://localhost/api/v1/health |
            python3 -c 'import json, sys, tomllib; got = json.load(sys.stdin)["server_version"]; want = tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"]; print(got); assert got == want, (got, want)'
      - name: The web interface is served
        run: |
          curl --fail --silent --show-error --insecure --output "$RUNNER_TEMP/index.html" https://localhost/
          grep -qi '<!doctype html>' "$RUNNER_TEMP/index.html"
      - name: The worker is running
        run: test "$($COMPOSE ps --status running --services | grep -c '^worker$')" = 1
      - name: The keeper is running
        run: test "$($COMPOSE ps --status running --services | grep -c '^keeper$')" = 1
      - name: The installation code is printed once
        run: test "$($COMPOSE logs api | grep -c 'Installatiecode')" = 1
      - name: Container state on failure
        if: failure()
        # No logs here: the api log holds the installation code.
        run: $COMPOSE ps --all
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes

  # The install with only a compose file (deploy/compose/docker-compose.yml): no deploy/.env,
  # no ./brievie. The images of a pull request are not on ghcr, so they are built to the
  # tags of deploy/compose/ci.override.yml; the file itself is untouched. Fresh start, then
  # what a security review asks: modes and owners of the vault, what each service sees, no
  # secret in `compose config`, `docker inspect`, any log or any process list, PostgreSQL
  # on an internal network, and a restart that keeps every secret.
  compose-stack:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/ci.override.yml
      BRIEVIE_HOSTNAME: localhost
    steps:
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The detector of the secrets check finds a planted secret
        run: .github/scripts/compose-secrets-check.sh selftest
      - name: Build the two images to the tags of the CI override
        run: |
          set -euo pipefail
          docker build --file deploy/Dockerfile --tag brievie/backend:ci .
          docker build --file deploy/Dockerfile.proxy --tag brievie/proxy:ci .
      - name: Start from the compose file alone
        run: |
          set -euo pipefail
          test ! -e deploy/.env
          $COMPOSE up -d --wait --wait-timeout 600
      - name: The API answers through Caddy and reports the version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/health |
            python3 -c 'import json, sys, tomllib; got = json.load(sys.stdin)["server_version"]; want = tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"]; print(got); assert got == want, (got, want)'
      - name: The web interface is served, with the headers of the Caddyfile
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --insecure --dump-header "$RUNNER_TEMP/headers.txt" \
            --output "$RUNNER_TEMP/index.html" https://localhost/
          grep -qi '<!doctype html>' "$RUNNER_TEMP/index.html"
          grep -qi '^content-security-policy: default-src .self.' "$RUNNER_TEMP/headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/headers.txt"
          grep -qi '^strict-transport-security:' "$RUNNER_TEMP/headers.txt"
          if grep -qi '^server:' "$RUNNER_TEMP/headers.txt"; then
            echo "The proxy answers with a Server header." >&2
            exit 1
          fi
      - name: The worker and the keeper run, and the one-shot services ended well
        run: |
          set -euo pipefail
          test "$($COMPOSE ps --status running --services | grep -c -x -E 'worker|keeper|api|caddy|postgres')" = 5
          for service in init-secrets init; do
            test "$(docker inspect "$($COMPOSE ps -aq "$service")" --format '{{.State.ExitCode}}')" = 0
          done
      - name: The installation code is printed once
        run: test "$($COMPOSE logs api | grep -c 'Installatiecode')" = 1
      - name: The vault, the role volumes, the networks and no secret anywhere
        run: .github/scripts/compose-secrets-check.sh check
      - name: A restart makes no new secret and the server still answers
        run: |
          set -euo pipefail
          .github/scripts/compose-secrets-check.sh snapshot > "$RUNNER_TEMP/before.txt"
          $COMPOSE down
          $COMPOSE up -d --wait --wait-timeout 600
          .github/scripts/compose-secrets-check.sh snapshot > "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/health
      - name: Container state on failure
        if: failure()
        # No logs here: the api log holds the installation code.
        run: $COMPOSE ps --all || true
      - name: The log of the one-shot services on failure
        if: failure()
        # The one-shot services print sentences, never a secret (the secrets check proves it).
        run: $COMPOSE logs --no-color init-secrets init || true
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes || true

  # The oldest Docker Compose we promise to work with (S 4.13): the file uses anchors with
  # merge keys, depends_on conditions, profiles, network_mode: none and nested defaults.
  # This proves an old Compose, not a Synology or an Unraid.
  compose-oldest:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/ci.override.yml
      BRIEVIE_HOSTNAME: localhost
      # Raise this (and DECISIONS.md) when a feature of the file needs a newer Compose.
      OLDEST_COMPOSE: v2.20.2
      OLDEST_COMPOSE_SHA256: b9385dabb7931636a3afc0aee94625ebff3bb29584493a87804afb6ebaf2d916
    steps:
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install that Compose as the user plugin, checked by its checksum
        run: |
          set -euo pipefail
          plugin="$HOME/.docker/cli-plugins/docker-compose"
          mkdir -p "$(dirname "$plugin")"
          curl --fail --silent --show-error --location --output "$plugin" \
            "https://github.com/docker/compose/releases/download/${OLDEST_COMPOSE}/docker-compose-linux-x86_64"
          echo "$OLDEST_COMPOSE_SHA256  $plugin" | sha256sum --check -
          chmod 0755 "$plugin"
          docker compose version | tee "$RUNNER_TEMP/version.txt"
          grep -qx "Docker Compose version $OLDEST_COMPOSE" "$RUNNER_TEMP/version.txt"
      - name: Build the two images to the tags of the CI override
        run: |
          set -euo pipefail
          docker build --file deploy/Dockerfile --tag brievie/backend:ci .
          docker build --file deploy/Dockerfile.proxy --tag brievie/proxy:ci .
      - name: The file is valid and the old Compose has no warning about it
        run: |
          set -euo pipefail
          $COMPOSE config --quiet 2> "$RUNNER_TEMP/warnings.txt"
          cat "$RUNNER_TEMP/warnings.txt"
          test ! -s "$RUNNER_TEMP/warnings.txt"
      - name: Start and answer
        run: |
          set -euo pipefail
          $COMPOSE up -d --wait --wait-timeout 600
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/health
      - name: Container state on failure
        if: failure()
        run: $COMPOSE ps --all || true
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes || true

  # Moving from a ./brievie install to the compose file on the same volumes (S 4.11): the
  # keys come from deploy/.env into the vault through a file (never the environment),
  # nothing is regenerated, the data opens, the paired device still signs in and the
  # certificate authority is byte for byte the same.
  adopt:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      WRAPPER: docker compose -p brievie --project-directory deploy -f deploy/docker-compose.yml
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/ci.override.yml
    steps:
      # This job ends with `down --volumes` of the fixed project brievie: only on a fresh
      # GitHub-hosted machine, never on a self-hosted runner that may run Brievie itself.
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a ./brievie install with data
        run: |
          set -euo pipefail
          umask 077
          sh deploy/init-env.sh
          ./brievie start
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/server/ca-certificate | jq -j .pem > "$RUNNER_TEMP/old-root.pem"
          grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/old-root.pem"
          $WRAPPER exec -T api python manage.py shell -c "$(cat .github/scripts/restore-seed.py)" |
            grep '^{"token"' > "$RUNNER_TEMP/seed.json"
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/seed.json")"
          test "$(jq '.workspaces | length' "$RUNNER_TEMP/seed.json")" = 2
          python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])' \
            > "$RUNNER_TEMP/version.txt"
      - name: Stop the wrapper's containers (no volume is removed)
        run: $WRAPPER down
      - name: Build the two images to the tags of the CI override
        run: |
          set -euo pipefail
          docker build --file deploy/Dockerfile --tag brievie/backend:ci .
          docker build --file deploy/Dockerfile.proxy --tag brievie/proxy:ci .
      - name: Without the keys the compose file refuses to make new ones next to the data
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE run --rm init-secrets > "$RUNNER_TEMP/refused.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/refused.log"
          test "$rc" != 0
          grep -q 'sleutels ontbreken' "$RUNNER_TEMP/refused.log"
      - name: Import the keys of deploy/.env into the vault, from a file
        run: |
          set -euo pipefail
          $COMPOSE run --rm -v "$PWD/deploy/.env:/import/env:ro" init-secrets \
            python -m apps.installer.init_secrets --import /import/env
      - name: Start the compose file on the same volumes, settings from deploy/.env
        run: |
          set -euo pipefail
          # --env-file feeds only the settings the file names (host name, ports, folder).
          BRIEVIE_ADOPT_VERSION="$(cat "$RUNNER_TEMP/version.txt")" \
            $COMPOSE --env-file deploy/.env up -d --wait --wait-timeout 600
          test "$(docker inspect "$($COMPOSE ps -aq init)" --format '{{.State.ExitCode}}')" = 0
      - name: The same server answers with the same authority, pages and device
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health
          .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: The keys were imported, not made, and nothing leaks
        run: |
          set -euo pipefail
          # The master key of the vault is the one of deploy/.env.
          want=$(grep '^BRIEVIE_MASTER_KEY=' deploy/.env | tail -n 1 | cut -d= -f2-)
          echo "::add-mask::$want"
          got=$(docker run --rm --user 0 --network none -v brievie_secrets:/v:ro brievie/backend:ci cat /v/master_key)
          test "$got" = "$want"
          test "$($COMPOSE logs api | grep -c 'Installatiecode')" = 0
          .github/scripts/compose-secrets-check.sh check
      - name: Container state on failure
        if: failure()
        run: $COMPOSE ps --all || true
      - name: The log of the one-shot services on failure
        if: failure()
        run: $COMPOSE logs --no-color init-secrets init || true
      - name: Stop
        if: always()
        run: |
          $COMPOSE down --volumes || true
          $WRAPPER down --volumes || true

  # Updating by changing the version number in the compose file (S 4.6), with the same
  # throwaway releases as the job `update`. Proves the two assumptions of the design:
  # when `init` refuses, the running containers stay up, and the read-only freeze stops
  # the old api from writing. Then the refusals (too large a jump, a step back), the update
  # with its emergency back-up, a failing migration (frozen, way back printed) and the way
  # back with restore_install.
  compose-update:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/ci.override.yml
      BRIEVIE_HOSTNAME: localhost
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make throwaway releases and build their images
        id: releases
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" branch -f ci-update HEAD
          git clone -q --no-hardlinks --branch ci-update "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"
          python3 .github/scripts/update-releases.py "$RUNNER_TEMP/source" | tee -a "$GITHUB_OUTPUT"
          for version in $(sed -n -E 's/^(installed|good|bad)=//p' "$GITHUB_OUTPUT"); do
            git -C "$RUNNER_TEMP/source" worktree add -q "$RUNNER_TEMP/tree-$version" "v$version"
            docker build --file "$RUNNER_TEMP/tree-$version/deploy/Dockerfile" \
              --tag "brievie/backend:$version" "$RUNNER_TEMP/tree-$version"
            docker build --file "$RUNNER_TEMP/tree-$version/deploy/Dockerfile.proxy" \
              --tag "brievie/proxy:$version" "$RUNNER_TEMP/tree-$version"
          done
      - name: Start the oldest release from the compose file, seed it, keep its authority
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.installed }}
        run: |
          set -euo pipefail
          umask 077
          $COMPOSE up -d --wait --wait-timeout 600
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/server/ca-certificate | jq -j .pem > "$RUNNER_TEMP/old-root.pem"
          $COMPOSE exec -T api python manage.py shell -c "$(cat .github/scripts/restore-seed.py)" |
            grep '^{"token"' > "$RUNNER_TEMP/seed.json"
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/seed.json")"
          test "$(jq '.workspaces | length' "$RUNNER_TEMP/seed.json")" = 2
      - name: A jump that is too large is refused and the old containers keep running
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.bad }}
          INSTALLED: ${{ steps.releases.outputs.installed }}
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE up -d --wait --wait-timeout 300 > "$RUNNER_TEMP/jump.log" 2>&1 || rc=$?
          test "$rc" != 0
          $COMPOSE logs --no-color init | tee "$RUNNER_TEMP/jump-init.log"
          grep -q 'niet in één keer' "$RUNNER_TEMP/jump-init.log"
          grep -q 'Er is niets veranderd' "$RUNNER_TEMP/jump-init.log"
          $COMPOSE ps --all --format '{{.Service}} {{.State}} {{.Status}}'
          running=$($COMPOSE ps --status running --services | sort | tr '\n' ' ')
          test "$running" = "api caddy keeper postgres worker "
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$INSTALLED" '.server_version == $want'
          # Nothing was frozen: the old api can still write.
          test "$($COMPOSE exec -T postgres psql -U postgres -d brievie -tA \
            -c "select count(*) from pg_db_role_setting s join pg_database d on d.oid = s.setdatabase where d.datname = 'brievie'")" = 0
      - name: The same pages, devices and authority after the refusal
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: Update to the next release by changing the version
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.good }}
          INSTALLED: ${{ steps.releases.outputs.installed }}
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          $COMPOSE up -d --wait --wait-timeout 600
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
          $COMPOSE logs --no-color init | grep -q "Brievie $GOOD is klaar om te starten"
          sql() { $COMPOSE exec -T postgres psql -U postgres -d brievie -tA -c "$1"; }
          test "$(sql "select version from updates_installedversion")" = "$GOOD"
          test "$(sql "select from_version || '>' || to_version from updates_serverupdate")" = "$INSTALLED>$GOOD"
          test "$(sql "select status from backup_backuprun where label = 'pre-update-$GOOD'")" = succeeded
          test "$(sql "select backup_run_id is not null from updates_serverupdate")" = t
          # The freeze is lifted again.
          test "$(sql "select count(*) from pg_db_role_setting s join pg_database d on d.oid = s.setdatabase where d.datname = 'brievie'")" = 0
      - name: The updated server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: A step back is refused, the newer containers keep running and the data stay
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.installed }}
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE up -d --wait --wait-timeout 300 > "$RUNNER_TEMP/back.log" 2>&1 || rc=$?
          test "$rc" != 0
          $COMPOSE logs --no-color init | tee "$RUNNER_TEMP/back-init.log"
          grep -q 'oudere versie' "$RUNNER_TEMP/back-init.log"
          $COMPOSE ps --all --format '{{.Service}} {{.State}} {{.Status}}'
          running=$($COMPOSE ps --status running --services | sort | tr '\n' ' ')
          test "$running" = "api caddy keeper postgres worker "
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
      - name: Another PostgreSQL major is refused (a release that says so)
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          # The image's release.json names the major it is built for; the running server is
          # 18. The gate compares the two (unit-tested); here the running server's major is
          # read as the gate reads it.
          test "$($COMPOSE exec -T postgres psql -U postgres -d brievie -tA -c 'show server_version_num' | cut -c1-2)" = 18
          jq -e '.postgres_major == 18' deploy/release.json
      - name: Update to a release whose migration fails (frozen, the way back printed)
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.bad }}
          BAD: ${{ steps.releases.outputs.bad }}
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE up -d --wait --wait-timeout 300 > "$RUNNER_TEMP/failed.log" 2>&1 || rc=$?
          test "$rc" != 0
          $COMPOSE logs --no-color init | tee "$RUNNER_TEMP/failed-init.log"
          grep -q 'halverwege mislukt' "$RUNNER_TEMP/failed-init.log"
          grep -q "pre-update-$BAD" "$RUNNER_TEMP/failed-init.log"
          # The database stays read-only; the old api still reads.
          test "$($COMPOSE exec -T postgres psql -U postgres -d brievie -tA \
            -c "select count(*) from pg_db_role_setting s join pg_database d on d.oid = s.setdatabase where d.datname = 'brievie'")" = 1
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
      - name: The frozen database refuses a write of the old version
        env:
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE exec -T api python manage.py shell -c \
            "from apps.workspaces.models import Workspace; from django.db import connection; c = connection.cursor(); c.execute(\"create temp table ci_frozen (x int)\")" \
            > "$RUNNER_TEMP/frozen.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/frozen.log"
          test "$rc" != 0
          grep -q 'read-only transaction' "$RUNNER_TEMP/frozen.log"
      - name: Take the way back with restore_install, then start the old version
        env:
          BAD: ${{ steps.releases.outputs.bad }}
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          export BRIEVIE_CI_TAG=$GOOD
          $COMPOSE stop api worker keeper caddy
          # The emergency back-up of the update is in the volume update-backup.
          BRIEVIE_BACKUP_DIR=update-backup $COMPOSE --profile admin run --rm admin \
            python manage.py restore_install "pre-update-$BAD" --replace | tee "$RUNNER_TEMP/way-back.log"
          grep -q 'Herstel gelukt' "$RUNNER_TEMP/way-back.log"
          $COMPOSE up -d --wait --wait-timeout 600
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
      - name: The server after the way back has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: Container state on failure
        if: failure()
        run: $COMPOSE ps --all || true
      - name: The log of the one-shot services on failure
        if: failure()
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.good }}
        run: $COMPOSE logs --no-color init-secrets init || true
      - name: Stop
        if: always()
        env:
          BRIEVIE_CI_TAG: ${{ steps.releases.outputs.installed }}
        run: $COMPOSE down --volumes || true

  # A restore onto an empty machine and over a running one, from a compose-only install:
  # the sheet's master key goes into the vault first (`--import`), then restore_install.
  compose-restore:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/ci.override.yml
      BRIEVIE_HOSTNAME: localhost
    steps:
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the two images to the tags of the CI override
        run: |
          set -euo pipefail
          docker build --file deploy/Dockerfile --tag brievie/backend:ci .
          docker build --file deploy/Dockerfile.proxy --tag brievie/proxy:ci .
      - name: A back-up folder outside the stack, for the keeper (uid 10001)
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/backup"
          sudo chown 10001:10001 "$RUNNER_TEMP/backup"
          echo "BRIEVIE_BACKUP_DIR=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"
      - name: Start, seed, set up the back-up and make one
        run: |
          set -euo pipefail
          umask 077
          $COMPOSE up -d --wait --wait-timeout 600
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/server/ca-certificate | jq -j .pem > "$RUNNER_TEMP/old-root.pem"
          $COMPOSE exec -T api python manage.py shell -c "$(cat .github/scripts/restore-seed.py)" |
            grep '^{"token"' > "$RUNNER_TEMP/seed.json"
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/seed.json")"
          # The runner's folder shares the disk with Docker's volumes: this proves the guard.
          $COMPOSE --profile admin run --rm admin python manage.py backup_init --allow-same-disk
          $COMPOSE --profile admin run --rm admin python manage.py backup
          $COMPOSE --profile admin run --rm admin python manage.py backup_status
      - name: Keep the master key, as a person keeps the recovery sheet
        run: |
          set -euo pipefail
          umask 077
          key=$(docker run --rm --user 0 --network none -v brievie_secrets:/v:ro brievie/backend:ci cat /v/master_key)
          echo "::add-mask::$key"
          printf 'BRIEVIE_MASTER_KEY=%s\n' "$key" > "$RUNNER_TEMP/sheet-key.env"
      - name: Destroy the machine (only the back-up folder is left)
        run: |
          set -euo pipefail
          $COMPOSE down --volumes
          if docker volume ls -q | grep -q '^brievie_'; then
            echo "A volume of the project is left after down --volumes." >&2
            exit 1
          fi
          test -f "$RUNNER_TEMP/backup/brievie-backup.json"
      - name: A new machine, the sheet's key into the vault first, then restore
        run: |
          set -euo pipefail
          $COMPOSE run --rm -v "$RUNNER_TEMP/sheet-key.env:/import/env:ro" init-secrets \
            python -m apps.installer.init_secrets --import /import/env
          $COMPOSE up -d --wait --wait-timeout 300 postgres
          $COMPOSE --profile admin run --rm admin python manage.py restore_install | tee "$RUNNER_TEMP/restore.log"
          grep -q 'Herstel gelukt' "$RUNNER_TEMP/restore.log"
          $COMPOSE up -d --wait --wait-timeout 600
      - name: The restored server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: It backs up again without handwork
        run: |
          set -euo pipefail
          $COMPOSE --profile admin run --rm admin python manage.py backup
          $COMPOSE --profile admin run --rm admin python manage.py backup_status | tee "$RUNNER_TEMP/status.log"
      - name: Restoring over running data needs --replace and the services stopped
        run: |
          set -euo pipefail
          rc=0
          $COMPOSE --profile admin run --rm admin python manage.py restore_install --replace \
            > "$RUNNER_TEMP/running.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/running.log"
          test "$rc" != 0
          grep -q 'draait nog' "$RUNNER_TEMP/running.log"
          $COMPOSE stop api worker keeper caddy
          rc=0
          $COMPOSE --profile admin run --rm admin python manage.py restore_install \
            > "$RUNNER_TEMP/no-replace.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/no-replace.log"
          test "$rc" != 0
          grep -q -e '--replace' "$RUNNER_TEMP/no-replace.log"
      - name: Restore over the data (--replace)
        run: |
          set -euo pipefail
          $COMPOSE --profile admin run --rm admin python manage.py restore_install --replace |
            tee "$RUNNER_TEMP/replace.log"
          grep -q 'Herstel gelukt' "$RUNNER_TEMP/replace.log"
          $COMPOSE up -d --wait --wait-timeout 600
      - name: The replaced server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: Container state on failure
        if: failure()
        run: $COMPOSE ps --all || true
      - name: The log of the one-shot services on failure
        if: failure()
        run: $COMPOSE logs --no-color init-secrets init || true
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes || true

  # OWASP ZAP against the running stack, started as in `stack`: a passive baseline scan
  # of the web interface and an active scan of every operation in the OpenAPI contract,
  # both unauthenticated. .zap/rules.tsv says which alerts fail the job (FAIL) and which
  # are ignored and why; -I keeps the other warnings from failing. ZAP does not validate
  # the server's certificate (zaproxy/zaproxy#7165), so Caddy's private CA is accepted.
  #
  # The host name: Java (ZAP) sends no SNI for a name without a dot such as `localhost`,
  # and Caddy then has no certificate to offer (TLS "internal_error"). This job serves
  # the stack as brievie.test (a reserved name) instead, resolved to the runner through
  # /etc/hosts, which a --network=host container (how the ZAP actions run it) shares.
  # Real installations keep their own BRIEVIE_HOSTNAME (default localhost).
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose --project-directory deploy -f deploy/docker-compose.yml
      ZAP_HOST: brievie.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create deploy/.env with fresh secrets, served as brievie.test
        run: |
          set -eu
          sh deploy/init-env.sh
          # Only the host name changes; nothing of deploy/.env is printed.
          sed -i "s/^BRIEVIE_HOSTNAME=.*/BRIEVIE_HOSTNAME=$ZAP_HOST/" deploy/.env
          test "$(grep -c "^BRIEVIE_HOSTNAME=$ZAP_HOST\$" deploy/.env)" = 1
          echo "127.0.0.1 $ZAP_HOST" | sudo tee -a /etc/hosts
      - name: Build and start the stack
        id: up
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: The API answers through Caddy
        run: |
          # Caddy signs with its own CA, which this runner does not trust.
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            "https://$ZAP_HOST/api/v1/health"
      # The ZAP container has the workspace at /zap/wrk: the paths below are relative to
      # the checkout, and the reports land in its root. The scans may fail (findings, or
      # a scan that could not run); the reports are kept first, the verdict comes last.
      - name: ZAP baseline scan of the web interface
        id: baseline
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://brievie.test/
          # ZAP 2.17.0, the image the actions' default tag "stable" pointed at, by digest.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Keep the baseline reports
        if: ${{ !cancelled() && steps.baseline.outcome != 'skipped' }}
        run: |
          mkdir -p zap-reports/baseline
          for report in report_html.html report_md.md report_json.json; do
            if [ -f "$report" ]; then mv "$report" zap-reports/baseline/; fi
          done
      - name: ZAP API scan of the OpenAPI contract
        id: api
        # Also when the baseline failed: both reports are wanted.
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        continue-on-error: true
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: docs/api/openapi.json
          # ZAP 2.17.0, the image the actions' default tag "stable" pointed at, by digest.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          format: openapi
          rules_file_name: .zap/rules.tsv
          # The contract has no "servers": -O points every operation at the stack.
          cmd_options: -I -O https://brievie.test
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api
      - name: Keep the API scan reports
        if: ${{ !cancelled() && steps.api.outcome != 'skipped' }}
        run: |
          mkdir -p zap-reports/api
          for report in report_html.html report_md.md report_json.json; do
            if [ -f "$report" ]; then mv "$report" zap-reports/api/; fi
          done
      - name: Upload the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: zap-reports/
          if-no-files-found: warn
      - name: The scans passed
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          API: ${{ steps.api.outcome }}
        run: |
          echo "baseline: $BASELINE, api: $API"
          test "$BASELINE" = success
          test "$API" = success
      - name: Container state on failure
        if: failure()
        # No logs here: the api log holds the installation code.
        run: $COMPOSE ps --all
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes

  # The way an admin updates (design 7.3): install a release, seed it, `./brievie update`
  # to the next one, then an update whose migration fails, and the way back it prints,
  # typed literally. The releases are throwaway tags in a clone on the runner
  # (update-releases.py); nothing is pushed. No back-up destination: the emergency copy
  # in the volume update-backup is the way back.
  update:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -p brievie --project-directory deploy -f deploy/docker-compose.yml
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      # This job ends with `down --volumes` of the fixed project brievie: only on a fresh
      # GitHub-hosted machine, never on a self-hosted runner that may run Brievie itself.
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make throwaway releases and install the oldest
        id: releases
        run: |
          set -euo pipefail
          # A branch at the commit under test: a pull request's checkout is detached.
          git -C "$GITHUB_WORKSPACE" branch -f ci-update HEAD
          git clone -q --no-hardlinks --branch ci-update "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"
          python3 .github/scripts/update-releases.py "$RUNNER_TEMP/source" | tee -a "$GITHUB_OUTPUT"
          git clone -q --bare "$RUNNER_TEMP/source" "$RUNNER_TEMP/origin.git"
          git clone -q "$RUNNER_TEMP/origin.git" "$RUNNER_TEMP/install"
          installed=$(sed -n 's/^installed=//p' "$GITHUB_OUTPUT" | tail -n 1)
          git -C "$RUNNER_TEMP/install" -c advice.detachedHead=false checkout -q "v$installed"
      - name: Start the oldest release, keep its authority and its master key
        env:
          INSTALLED: ${{ steps.releases.outputs.installed }}
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/install"
          sh deploy/init-env.sh
          ./brievie start
          grep -qx "BRIEVIE_VERSION=$INSTALLED" deploy/.env
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/server/ca-certificate | jq -j .pem > "$RUNNER_TEMP/old-root.pem"
          key=$(grep '^BRIEVIE_MASTER_KEY=' deploy/.env | tail -n 1 | cut -d= -f2-)
          echo "::add-mask::$key"
          printf '%s\n' "$key" > "$RUNNER_TEMP/master-key"
      - name: Seed two workspaces, a letter in each and a paired device
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/install"
          $COMPOSE exec -T api python manage.py shell -c "$(cat .github/scripts/restore-seed.py)" |
            grep '^{"token"' > "$RUNNER_TEMP/seed.json"
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/seed.json")"
          test "$(jq '.workspaces | length' "$RUNNER_TEMP/seed.json")" = 2
      - name: Update to the next release
        env:
          INSTALLED: ${{ steps.releases.outputs.installed }}
          GOOD: ${{ steps.releases.outputs.good }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          BRIEVIE_UPDATE_CONFIRM=BIJWERKEN ./brievie update "$GOOD" | tee "$RUNNER_TEMP/update.log"
          grep -qx "Bijgewerkt naar versie $GOOD\." "$RUNNER_TEMP/update.log"
          grep -q 'telt niet als back-up' "$RUNNER_TEMP/update.log"
          test ! -e deploy/.update/in-progress
          grep -qx "BRIEVIE_VERSION=$GOOD" deploy/.env
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
          ./brievie status | tee "$RUNNER_TEMP/status.log"
          grep -q "Laatst bijgewerkt: $INSTALLED → $GOOD" "$RUNNER_TEMP/status.log"
      - name: The updated server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: An update whose migration fails prints the way back
        env:
          GOOD: ${{ steps.releases.outputs.good }}
          BAD: ${{ steps.releases.outputs.bad }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          # Exit 3 is the expected outcome (failed after the switch, way back printed).
          # The runner's shell has -e: the status is caught here, not by `set +e`.
          rc=0
          BRIEVIE_UPDATE_CONFIRM=BIJWERKEN ./brievie update "$BAD" > "$RUNNER_TEMP/failed.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/failed.log"
          test "$rc" = 3
          grep -qx "  git checkout v$GOOD" "$RUNNER_TEMP/failed.log"
          grep -qx "  ./brievie restore pre-update-$BAD --replace --skip-safety-backup" "$RUNNER_TEMP/failed.log"
          test -e deploy/.update/in-progress
      - name: Take the way back, as printed
        env:
          GOOD: ${{ steps.releases.outputs.good }}
          BAD: ${{ steps.releases.outputs.bad }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/install"
          git -c advice.detachedHead=false checkout -q "v$GOOD"
          # The key comes on stdin (no terminal), as in the job `restore`.
          BRIEVIE_RESTORE_CONFIRM=WISSEN ./brievie restore "pre-update-$BAD" --replace --skip-safety-backup \
            --keep-hostname < "$RUNNER_TEMP/master-key" | tee "$RUNNER_TEMP/back.log"
          grep -qx 'Herstel gelukt\.' "$RUNNER_TEMP/back.log"
          test ! -e deploy/.update/in-progress
          grep -qx "BRIEVIE_VERSION=$GOOD" deploy/.env
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --cacert "$RUNNER_TEMP/old-root.pem" https://localhost/api/v1/health |
            jq -e --arg want "$GOOD" '.server_version == $want'
          ./brievie update "$GOOD" | tee "$RUNNER_TEMP/again.log"
          grep -qx "Je hebt al versie $GOOD\." "$RUNNER_TEMP/again.log"
      - name: The server after the way back has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: Container state on failure
        if: failure()
        # No logs here: the api log holds the installation code.
        run: cd "$RUNNER_TEMP/install" && $COMPOSE ps --all || true
      - name: Stop
        if: always()
        run: cd "$RUNNER_TEMP/install" && $COMPOSE down --volumes || true

  # Nobody watches a scheduled run: when one fails, open an issue (or comment on the open
  # one). Only the schedule, never a pull request or a push; the job ids and the run URL
  # go in the issue, no log lines (workflow audit-failed.yml). Only `issues: write` here.
  audit-failed:
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    needs: [audit-python, audit-node, secrets, workflows, image, dast]
    permissions:
      issues: write
    # actionlint (1.7.12) does not know the `$/` self-repository syntax yet.
    uses: ./.github/workflows/audit-failed.yml # zizmor: ignore[self-repository]
    with:
      needs: ${{ toJSON(needs) }}

  # A back-up is only worth something when it restores onto an empty machine. This job
  # makes a server, seeds it, backs it up, destroys everything (containers, volumes,
  # deploy/.env) and restores from the back-up folder and the master key alone, twice:
  # onto the empty machine, then over the running server with --replace.
  restore:
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # What ./brievie uses on a default checkout (project "brievie").
      COMPOSE: docker compose -p brievie --project-directory deploy -f deploy/docker-compose.yml
    steps:
      # This job ends with `down --volumes` of the fixed project brievie: only on a fresh
      # GitHub-hosted machine, never on a self-hosted runner that may run Brievie itself.
      - name: Only on a GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create deploy/.env and a back-up folder outside the stack
        run: |
          set -euo pipefail
          sh deploy/init-env.sh
          # A folder on the runner, not a named volume: `down --volumes` removes those,
          # and the back-up has to survive the machine. The keeper runs as uid 10001.
          mkdir "$RUNNER_TEMP/backup"
          sudo chown 10001:10001 "$RUNNER_TEMP/backup"
          printf 'BRIEVIE_BACKUP_DIR=%s\n' "$RUNNER_TEMP/backup" >> deploy/.env
      - name: Build and start Brievie
        run: ./brievie start
      - name: The API answers through Caddy, and its authority is saved
        run: |
          set -euo pipefail
          # Caddy signs with its own authority, which this runner does not trust (yet).
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/health
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/api/v1/server/ca-certificate | jq -j .pem > "$RUNNER_TEMP/old-root.pem"
          grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/old-root.pem"
      - name: Seed two workspaces, a letter in each and a paired device
        run: |
          set -euo pipefail
          umask 077
          # The script prints one JSON line (with the device token): into a file, never the log.
          $COMPOSE exec -T api python manage.py shell -c "$(cat .github/scripts/restore-seed.py)" |
            grep '^{"token"' > "$RUNNER_TEMP/seed.json"
          echo "::add-mask::$(jq -r .token "$RUNNER_TEMP/seed.json")"
          test "$(jq '.workspaces | length' "$RUNNER_TEMP/seed.json")" = 2
      - name: Set up the back-up and make one
        run: |
          set -euo pipefail
          # The runner's folder shares the disk with Docker's volumes: this proves the guard.
          ./brievie backup --init --allow-same-disk
          ./brievie backup
          ./brievie status
      - name: Keep the master key, as a person keeps the recovery sheet
        run: |
          set -euo pipefail
          umask 077
          key=$(grep '^BRIEVIE_MASTER_KEY=' deploy/.env | tail -n 1 | cut -d= -f2-)
          echo "::add-mask::$key"
          printf '%s\n' "$key" > "$RUNNER_TEMP/master-key"
      - name: Destroy the machine
        run: |
          set -euo pipefail
          # While deploy/.env is still there: compose refuses to run without its secrets.
          $COMPOSE down --volumes
          rm deploy/.env
          if docker volume ls -q | grep -q '^brievie_'; then
            echo "A volume of the project is left after down --volumes." >&2
            exit 1
          fi
          # Only the back-up folder is left.
          test -f "$RUNNER_TEMP/backup/brievie-backup.json"
      - name: Restore onto the empty machine
        run: |
          set -euo pipefail
          # The key comes on stdin (no terminal); the source is the folder, as a person
          # would type it. The old settings do not exist any more: the back-up has them.
          BRIEVIE_RESTORE_SOURCE="$RUNNER_TEMP/backup" BRIEVIE_RESTORE_KEEP_DESTINATION=ja \
            ./brievie restore --keep-hostname < "$RUNNER_TEMP/master-key" |
            tee "$RUNNER_TEMP/restore.log"
          grep -qx 'Herstel gelukt\.' "$RUNNER_TEMP/restore.log"
      - name: The restored server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: The restored server backs up again without handwork
        run: |
          set -euo pipefail
          ./brievie backup
          ./brievie status | tee "$RUNNER_TEMP/status.log"
          grep -q '^Bestemming: map' "$RUNNER_TEMP/status.log"
          if grep -q '^Laatste fout' "$RUNNER_TEMP/status.log"; then
            echo "The status shows a failed back-up." >&2
            exit 1
          fi
      - name: Restore over the running server (--replace)
        run: |
          set -euo pipefail
          BRIEVIE_RESTORE_SOURCE="$RUNNER_TEMP/backup" BRIEVIE_RESTORE_CONFIRM=WISSEN \
            ./brievie restore --replace --keep-hostname < "$RUNNER_TEMP/master-key" |
            tee "$RUNNER_TEMP/replace.log"
          grep -qx 'Herstel gelukt\.' "$RUNNER_TEMP/replace.log"
      - name: The replaced server has the same pages, devices and authority
        run: .github/scripts/restore-check.sh "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/old-root.pem"
      - name: Container state on failure
        if: failure()
        # No logs here: the api log holds the installation code.
        run: $COMPOSE ps --all || true
      - name: Stop
        if: always()
        run: $COMPOSE down --volumes || true
