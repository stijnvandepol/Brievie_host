# Trivy: vulnerabilities accepted for now, each with a reason and a date it expires.
# On `expired_at` the entry stops applying and the CI job `image` fails again, which is
# the review: update restic (or the entry) then.
#
# Only the restic binary (usr/local/bin/restic). restic 0.19.1 is the newest release
# (2026-07-05); the official image builds it with Go 1.25.10 and the module versions of
# its go.mod. These findings are fixed upstream in a newer Go or module version but not
# yet in a restic release. Rebuilding restic ourselves would make us the maintainer of a
# Go toolchain in the image; we take restic's next release instead. In Brievie, restic
# only talks to the back-up destination the administrator configured (a folder, a REST
# server or S3) and is never exposed to the network; it is run by the keeper and admin
# containers, never by the api.
# Listed from the Trivy run on 0.18.1 (CI, 2026-11-19), the 0.19.1 go.mod and OSV.
vulnerabilities:
