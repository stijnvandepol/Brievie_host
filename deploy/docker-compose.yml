name: brievie

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BRIEVIE_OWNER_PASSWORD: ${BRIEVIE_OWNER_PASSWORD:?set BRIEVIE_OWNER_PASSWORD in deploy/.env}
      BRIEVIE_APP_PASSWORD: ${BRIEVIE_APP_PASSWORD:?set BRIEVIE_APP_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brievie"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations as the schema owner, then exits. Only this
  # container gets the owner credentials; the api never sees them.
  migrate:
    image: brievie/backend:local
    # Same image as api, which builds it.
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BRIEVIE_DB_ROLE: owner
      DATABASE_OWNER_URL: postgres://brievie_owner:${BRIEVIE_OWNER_PASSWORD}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
    # createcachetable: the database cache that holds throttle counts (idempotent).
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py createcachetable"]
    restart: "no"

  api:
    image: brievie/backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://brievie_app:${BRIEVIE_APP_PASSWORD}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      BRIEVIE_PUBLIC_URLS: ${BRIEVIE_PUBLIC_URLS:-}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
