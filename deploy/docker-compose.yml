name: brievie

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BRIEVIE_OWNER_PASSWORD: ${BRIEVIE_OWNER_PASSWORD:?set BRIEVIE_OWNER_PASSWORD in deploy/.env}
      BRIEVIE_APP_PASSWORD: ${BRIEVIE_APP_PASSWORD:?set BRIEVIE_APP_PASSWORD in deploy/.env}
      BRIEVIE_BACKUP_DB_PASSWORD: ${BRIEVIE_BACKUP_DB_PASSWORD:?set BRIEVIE_BACKUP_DB_PASSWORD in deploy/.env (./brievie or sh deploy/init-env.sh adds it)}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brievie"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations as the schema owner, then exits. Only this
  # container gets the owner credentials; the api never sees them.
  migrate:
    image: ${BRIEVIE_IMAGE:-brievie/backend:local}
    # Same image as api, which builds it.
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BRIEVIE_DB_ROLE: owner
      DATABASE_OWNER_URL: postgres://brievie_owner:${BRIEVIE_OWNER_PASSWORD}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
    # createcachetable: the database cache that holds throttle counts (idempotent).
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py createcachetable"]
    restart: "no"

  api:
    image: ${BRIEVIE_IMAGE:-brievie/backend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://brievie_app:${BRIEVIE_APP_PASSWORD}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      DEBUG: ${DEBUG:-false}
      # Both follow BRIEVIE_HOSTNAME; set them only to deviate (they must agree: the api
      # refuses to start when a public URL's host is not in ALLOWED_HOSTS).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${BRIEVIE_HOSTNAME:?set BRIEVIE_HOSTNAME in deploy/.env}}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      BRIEVIE_PUBLIC_URLS: ${BRIEVIE_PUBLIC_URLS:-https://${BRIEVIE_HOSTNAME}:${BRIEVIE_HTTPS_PORT:-443}}
      BRIEVIE_HSTS_SECONDS: ${BRIEVIE_HSTS_SECONDS:-0}
      BRIEVIE_MAX_BODY_BYTES: ${BRIEVIE_MAX_BODY_BYTES:-2621440}
      BRIEVIE_MAX_UPLOAD_BYTES: ${BRIEVIE_MAX_UPLOAD_BYTES:-33554432}
      BRIEVIE_SETUP_TOKEN: ${BRIEVIE_SETUP_TOKEN:-}
      BRIEVIE_MASTER_KEY: ${BRIEVIE_MASTER_KEY:?set BRIEVIE_MASTER_KEY in deploy/.env (sh deploy/init-env.sh adds it)}
      # Requests arrive through Caddy, which sets X-Forwarded-For.
      BRIEVIE_PROXY_COUNT: "1"
      # How long a web session may sit idle and how long it lives at most; the worker
      # applies the same limits when it cleans up. The idle limit may not exceed the other.
      BRIEVIE_SESSION_IDLE_DAYS: ${BRIEVIE_SESSION_IDLE_DAYS:-14}
      BRIEVIE_SESSION_MAX_DAYS: ${BRIEVIE_SESSION_MAX_DAYS:-90}
    healthcheck:
      # The Host header must be an allowed host, so the first ALLOWED_HOSTS entry is used.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; h = os.environ['ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': 'localhost' if h in ('', '*') else h}), timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      # Only the public root of Caddy's internal CA (see caddy-publish-root.sh),
      # read-only, at the default BRIEVIE_CA_CERT_PATH. Never Caddy's data volume:
      # it holds the CA's private keys.
      - caddy-ca:/caddy-data/caddy/pki/authorities/local:ro
      # Encrypted document files (BRIEVIE_STORAGE_ROOT).
      - documents:/data/documents
    # No published port: only Caddy is reachable from outside.

  # Background jobs: same image as api, serves the queue in PostgreSQL. Letters are
  # processed from text in the database; only the member export reads the sealed page
  # files and writes its sealed ZIP, which is why the documents volume is mounted.
  worker:
    image: ${BRIEVIE_IMAGE:-brievie/backend:local}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://brievie_app:${BRIEVIE_APP_PASSWORD}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      BRIEVIE_MASTER_KEY: ${BRIEVIE_MASTER_KEY:?set BRIEVIE_MASTER_KEY in deploy/.env (sh deploy/init-env.sh adds it)}
      # Audit rows older than this many days are removed at night (at least 90).
      BRIEVIE_AUDIT_RETENTION_DAYS: ${BRIEVIE_AUDIT_RETENTION_DAYS:-365}
      # Sessions past these limits are removed every hour (the same values as the api's).
      BRIEVIE_SESSION_IDLE_DAYS: ${BRIEVIE_SESSION_IDLE_DAYS:-14}
      BRIEVIE_SESSION_MAX_DAYS: ${BRIEVIE_SESSION_MAX_DAYS:-90}
    command:
      - sh
      - -c
      - python manage.py check_master_key && exec python manage.py procrastinate worker --queues pipeline
    volumes:
      # Encrypted document files (BRIEVIE_STORAGE_ROOT): the member export reads the pages
      # and writes its file under exports/, which the api serves for the download.
      - documents:/data/documents
    # No published port.

  # Back-ups: same image, serves only the `backup` queue. It reads the database as the
  # read-only back-up role (pg_dump) and as the app role (Procrastinate, BackupRun), and
  # the document files and Caddy's CA read-only. It holds no master key, no superuser or
  # owner password: a stolen keeper cannot decrypt documents or change the schema.
  keeper:
    image: ${BRIEVIE_IMAGE:-brievie/backend:local}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # A running step gets a minute to finish; a longer one is killed and the stall
    # retry (retry_stalled_backup_jobs) picks the run up again.
    stop_grace_period: 1m
    environment:
      DATABASE_URL: postgres://brievie_app:${BRIEVIE_APP_PASSWORD}@postgres:5432/brievie
      DATABASE_BACKUP_URL: postgres://brievie_backup:${BRIEVIE_BACKUP_DB_PASSWORD:?set BRIEVIE_BACKUP_DB_PASSWORD in deploy/.env (./brievie or sh deploy/init-env.sh adds it)}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      BRIEVIE_HOSTNAME: ${BRIEVIE_HOSTNAME:?set BRIEVIE_HOSTNAME in deploy/.env}
      # Empty until ./brievie derives it from the master key (in the admin container).
      BRIEVIE_BACKUP_PASSWORD: ${BRIEVIE_BACKUP_PASSWORD:-}
      BRIEVIE_BACKUP_REPOSITORY: ${BRIEVIE_BACKUP_REPOSITORY:-}
      # A folder destination is mounted at /backup; this says whether it is a real one.
      BRIEVIE_BACKUP_DIR_SET: ${BRIEVIE_BACKUP_DIR:+true}
      BRIEVIE_BACKUP_APPEND_ONLY: ${BRIEVIE_BACKUP_APPEND_ONLY:-false}
      BRIEVIE_BACKUP_S3_ACCESS_KEY_ID: ${BRIEVIE_BACKUP_S3_ACCESS_KEY_ID:-}
      BRIEVIE_BACKUP_S3_SECRET_ACCESS_KEY: ${BRIEVIE_BACKUP_S3_SECRET_ACCESS_KEY:-}
      BRIEVIE_BACKUP_REST_USERNAME: ${BRIEVIE_BACKUP_REST_USERNAME:-}
      BRIEVIE_BACKUP_REST_PASSWORD: ${BRIEVIE_BACKUP_REST_PASSWORD:-}
    command: ["python", "manage.py", "procrastinate", "worker", "--queues", "backup"]
    volumes:
      - documents:/data/documents:ro
      # Caddy's CA (keys included), copied by caddy-publish-root.sh for the back-up only.
      - caddy-authority:/data/authority:ro
      - backup-config:/data/backup-config
      # A named volume while BRIEVIE_BACKUP_DIR is unset (BRIEVIE_BACKUP_DIR_SET is
      # then empty and nothing is written there).
      - ${BRIEVIE_BACKUP_DIR:-backup-unset}:/backup
    # No published port.

  # One-off maintenance (back-up set-up, restore, deriving the back-up password), run by
  # ./brievie as `run --rm --no-deps admin ...`; never started by `up`. Root, because a
  # restore writes every volume; it is the only container that holds both the master
  # key and the superuser password.
  admin:
    image: ${BRIEVIE_IMAGE:-brievie/backend:local}
    pull_policy: never
    profiles: ["admin"]
    restart: "no"
    user: "0"
    # Always run with an explicit command; `--profile admin up` then only prints help,
    # never the image's default (gunicorn, as root, with the master key).
    command: ["python", "manage.py", "help"]
    environment:
      # The keeper's, plus what set-up and restore need.
      DATABASE_URL: postgres://brievie_app:${BRIEVIE_APP_PASSWORD}@postgres:5432/brievie
      DATABASE_BACKUP_URL: postgres://brievie_backup:${BRIEVIE_BACKUP_DB_PASSWORD:?set BRIEVIE_BACKUP_DB_PASSWORD in deploy/.env (./brievie or sh deploy/init-env.sh adds it)}@postgres:5432/brievie
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      BRIEVIE_HOSTNAME: ${BRIEVIE_HOSTNAME:?set BRIEVIE_HOSTNAME in deploy/.env}
      # Empty until ./brievie derives it from the master key (in the admin container).
      BRIEVIE_BACKUP_PASSWORD: ${BRIEVIE_BACKUP_PASSWORD:-}
      BRIEVIE_BACKUP_REPOSITORY: ${BRIEVIE_BACKUP_REPOSITORY:-}
      # A folder destination is mounted at /backup; this says whether it is a real one.
      BRIEVIE_BACKUP_DIR_SET: ${BRIEVIE_BACKUP_DIR:+true}
      BRIEVIE_BACKUP_APPEND_ONLY: ${BRIEVIE_BACKUP_APPEND_ONLY:-false}
      BRIEVIE_BACKUP_S3_ACCESS_KEY_ID: ${BRIEVIE_BACKUP_S3_ACCESS_KEY_ID:-}
      BRIEVIE_BACKUP_S3_SECRET_ACCESS_KEY: ${BRIEVIE_BACKUP_S3_SECRET_ACCESS_KEY:-}
      BRIEVIE_BACKUP_REST_USERNAME: ${BRIEVIE_BACKUP_REST_USERNAME:-}
      BRIEVIE_BACKUP_REST_PASSWORD: ${BRIEVIE_BACKUP_REST_PASSWORD:-}
      BRIEVIE_MASTER_KEY: ${BRIEVIE_MASTER_KEY:-}
      DATABASE_SUPERUSER_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/brievie
      # The host path, for the recovery sheet.
      BRIEVIE_BACKUP_DIR_HOST: ${BRIEVIE_BACKUP_DIR:-}
    volumes:
      # Also needed by `backup --init`: it compares the disk of /backup with this one.
      - documents:/data/documents
      - caddy-data:/caddy-data
      - caddy-authority:/data/authority
      - backup-config:/data/backup-config
      # ./brievie sets BRIEVIE_BACKUP_MOUNT_MODE=ro for the restore steps: a restore
      # source is never written to (restic reads it with --no-lock).
      - ${BRIEVIE_BACKUP_DIR:-backup-unset}:/backup:${BRIEVIE_BACKUP_MOUNT_MODE:-rw}

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["/bin/sh", "/etc/caddy/publish-root.sh"]
    environment:
      BRIEVIE_HOSTNAME: ${BRIEVIE_HOSTNAME:?set BRIEVIE_HOSTNAME in deploy/.env}
      BRIEVIE_HSTS_SECONDS: ${BRIEVIE_HSTS_SECONDS:-0}
      BRIEVIE_MAX_BODY_BYTES: ${BRIEVIE_MAX_BODY_BYTES:-2621440}
      BRIEVIE_MAX_UPLOAD_BYTES: ${BRIEVIE_MAX_UPLOAD_BYTES:-33554432}
    ports:
      - "${BRIEVIE_HTTP_PORT:-80}:80"
      - "${BRIEVIE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-publish-root.sh:/etc/caddy/publish-root.sh:ro
      - caddy-data:/data
      - caddy-ca:/ca
      # A copy of the CA for the back-up (keeper and admin only; see caddy-publish-root.sh).
      - caddy-authority:/authority
      - caddy-config:/config

volumes:
  pgdata:
  documents:
  caddy-data:
  caddy-config:
  caddy-ca:
  caddy-authority:
  backup-config:
  backup-unset:
